[workspace]
members = ["crates/core", "crates/storage", "crates/dictionary", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
lexique-core = { path = "crates/core" }
lexique-storage = { path = "crates/storage" }
