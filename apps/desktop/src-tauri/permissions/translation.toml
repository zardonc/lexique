[[permission]]
identifier = "allow-translation-settings"
description = "Allows reading and updating translation settings."
commands.allow = ["translation_settings"]

[[permission]]
identifier = "allow-translation-clear-key"
description = "Allows clearing a translation credential."
commands.allow = ["translation_clear_key"]

[[permission]]
identifier = "allow-translation-execute"
description = "Allows explicitly starting an online translation."
commands.allow = ["translation_execute"]

[[permission]]
identifier = "allow-translation-cancel"
description = "Allows cancelling the active translation."
commands.allow = ["translation_cancel"]

[[permission]]
identifier = "allow-translation-test-connection"
description = "Allows explicitly testing a translation service."
commands.allow = ["translation_test_connection"]
