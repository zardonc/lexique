[package]
name = "lexique-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lexique_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
lexique-storage.workspace = true
lexique-dictionary = { path = "../../../crates/dictionary" }
rusqlite.workspace = true
serde.workspace = true
serde_json = "1"
cap-std = "4.0.3"
cap-primitives = "4.0.3"
cap-fs-ext = "=4.0.3"
tauri-plugin-global-shortcut = "=2.4.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "=0.23.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = { version = "=0.9.9", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "=0.2.0"
core-foundation = "=0.10.1"
