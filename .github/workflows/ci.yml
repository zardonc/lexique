name: scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:build-args
      - run: pnpm lint && pnpm typecheck && pnpm build
      - run: pnpm --filter @lexique/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup show
      - run: cargo fmt --all --check
      - run: python -X utf8 scripts/dictionary_sample.py prepare target/desktop-dictionary-sample
      - run: cargo clippy --locked -p lexique-core -p lexique-storage -p lexique-dictionary --all-targets -- -D warnings
      - run: cargo test --locked -p lexique-storage -p lexique-dictionary --no-run
      - run: node scripts/test-rust.mjs
      - run: cargo build --locked --release -p lexique-core --target wasm32-unknown-unknown
      - run: node scripts/check-wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: target/wasm32-unknown-unknown/release/lexique_core.wasm

  dictionary-resource:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s scripts -p test_dictionary_sample.py -v
      - run: python -X utf8 -m unittest discover -s scripts -p test_package_portable.py -v

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: amd64_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check --locked --workspace --target ${{ matrix.target }}

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tooling
      - run: pnpm desktop:portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            target/portable/*.zip
            target/portable/*.zip.sha256
          if-no-files-found: error
